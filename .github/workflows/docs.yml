name: Deploy Documentation

on:
  push:
    branches:
      - '**'
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "docs-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: python -m pip install --upgrade pip mkdocs

      - name: Resolve branch settings
        id: branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH="$(echo "${BRANCH_NAME}" | sed -E 's#[^A-Za-z0-9._-]+#-#g')"
          SITE_ROOT="https://usub-development.github.io/UIdentity/"
          EDIT_URI="edit/${BRANCH_NAME}/docs/"

          if [ "${BRANCH_NAME}" = "main" ]; then
            SITE_URL="${SITE_ROOT}"
            DESTINATION_DIR="."
          else
            SITE_URL="${SITE_ROOT}${SAFE_BRANCH}/"
            DESTINATION_DIR="${SAFE_BRANCH}"
          fi

          echo "branch_name=${BRANCH_NAME}" >> "${GITHUB_OUTPUT}"
          echo "safe_branch=${SAFE_BRANCH}" >> "${GITHUB_OUTPUT}"
          echo "site_url=${SITE_URL}" >> "${GITHUB_OUTPUT}"
          echo "edit_uri=${EDIT_URI}" >> "${GITHUB_OUTPUT}"
          echo "destination_dir=${DESTINATION_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Build documentation
        env:
          SITE_URL: ${{ steps.branch.outputs.site_url }}
          EDIT_URI: ${{ steps.branch.outputs.edit_uri }}
        run: mkdocs build --clean --strict -f docs/mkdocs.yml

      - name: Deploy documentation
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./site
          destination_dir: ${{ steps.branch.outputs.destination_dir }}
          keep_files: true

      - name: Publish deployment URL
        run: |
          echo "Docs deployed to ${{ steps.branch.outputs.site_url }}" >> "${GITHUB_STEP_SUMMARY}"
