services:
  redis:
    image: redis:7.4-alpine
    command: [ "redis-server", "--appendonly", "yes" ]

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.0
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: adminadmin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/realm-import:/opt/keycloak/data/import:ro

  uidentity:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
      - keycloak
    environment:
      UIDENTITY_LISTEN_HOST: 0.0.0.0
      UIDENTITY_LISTEN_PORT: 22813
      UIDENTITY_UVENT_THREADS: 1
      UIDENTITY_KEYCLOAK_AUTH_BASE_URL: http://localhost:8080
      UIDENTITY_KEYCLOAK_INTERNAL_BASE_URL: http://keycloak:8080
      UIDENTITY_KEYCLOAK_REALMS: trader merchant
      UIDENTITY_KEYCLOAK_CLIENT_ID_TRADER: myclient
      UIDENTITY_KEYCLOAK_CLIENT_ID_MERCHANT: myclient
      UIDENTITY_KEYCLOAK_REDIRECT_URI: http://localhost:22813/api/v1/callback
      UIDENTITY_KEYCLOAK_SCOPES: openid profile email
      UIDENTITY_REDIS_HOST: redis
      UIDENTITY_REDIS_PORT: 6379
      UIDENTITY_REDIS_FORCE_STANDALONE: "true"
      UIDENTITY_AUTH_EXPECTED_AZP_TRADER: myclient
      UIDENTITY_AUTH_EXPECTED_AZP_MERCHANT: myclient
      UIDENTITY_AUTH_JWKS_CACHE_TTL_SECONDS: "300"
      UIDENTITY_AUTH_REQUIRE_AUDIENCE: "false"
      UIDENTITY_HEALTH_PATH: /health/live
      UIDENTITY_READY_PATH: /health/ready
    ports:
      - "22813:22813"
